# ==========================================
# IconicYatra VPS Nginx Configuration
# Path: /etc/nginx/sites-available/iconicyatra
# ==========================================

server {
    listen 80;
    
    # Catch the master domain and ALL agency subdomains
    server_name iconicyatra.com *.iconicyatra.com;

    # 1. API BACKEND ROUTING (/api/v1)
    location /api {
        proxy_pass http://localhost:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # CRITICAL: Pass the original host so the Global SaaS Plugin knows which agency!
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # 2. SAAS ADMIN DASHBOARD ROUTING
    # Assuming dashboard is accessed via "admin.iconicyatra.com" or path "/admin"
    # To keep things clean, let's route any request to /admin to the Dashboard build
    location /admin {
        alias /var/www/iconicyatra/dashboard/dist;
        try_files $uri $uri/ /index.html;
    }

    # 3. PUBLIC CUSTOMER FRONTEND ROUTING
    # The main UI (frontend/dist) catches everything else
    location / {
        root /var/www/iconicyatra/frontend/dist;
        try_files $uri $uri/ /index.html;
    }

    # Optional: Serve uploaded images directly via Nginx (faster than Node.js)
    location /upload {
        alias /var/www/iconicyatra/backend/upload;
        access_log off;
        expires 30d;
    }
}
