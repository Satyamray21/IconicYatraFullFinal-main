# ==========================================
# IconicYatra VPS Nginx Configuration
# Path: /etc/nginx/sites-available/iconicyatra
# ==========================================

# 1. Dedicated Master Admin Dashboard Server Block
server {
    listen 80;
    server_name admin.iconicyatra.com;

    # Serve the React Dashboard at the root of admin.iconicyatra.com
    location / {
        root /var/www/iconicyatra/dashboard/dist;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls
    location /api {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }
}

# 2. Universal Agency Server Block (Master Frontend + All Tenants)
server {
    listen 80;
    server_name iconicyatra.com *.iconicyatra.com;

    # Proxy API calls
    location /api {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # How tenant agencies access their dashboard
    location /admin {
        alias /var/www/iconicyatra/dashboard/dist;
        try_files $uri $uri/ /index.html;
    }

    # Serve the Customer Frontend UI
    location / {
        root /var/www/iconicyatra/frontend/dist;
        try_files $uri $uri/ /index.html;
    }

    location /upload {
        alias /var/www/iconicyatra/backend/upload;
        access_log off;
        expires 30d;
    }
}
