# ==========================================
# IconicYatra VPS Nginx Configuration
# Path: /etc/nginx/sites-available/iconicyatra
# ==========================================

# 1. Dedicated Master Admin Dashboard Server Block
server {
    listen 80;
    server_name admin.iconicyatra.com;

    # Serve the React Dashboard at the root of admin.iconicyatra.com
    location / {
        root /var/www/iconicyatra/dashboard/dist;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls
    location /api {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }
}

# 2. Universal Agency Server Block (Master Frontend + All Tenants)
server {
    listen 80 default_server;
    server_name _;

    # Proxy API calls
    location /api {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # FORCE trailing slash for /admin
    location = /admin {
        return 301 /admin/;
    }

    # Tenant dashboard (HashRouter → refresh only needs /admin/ + static assets)
    # NOTE: try_files + alias is unreliable; use named location fallback
    location ^~ /admin/ {
        alias /var/www/iconicyatra/dashboard/dist/;
        try_files $uri $uri/ @tenant_admin;
    }

    location @tenant_admin {
        rewrite ^ /admin/index.html last;
    }

    # Explicitly proxy the root path and any HTML requests to Node for SEO injection
    location = / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~* \.html$ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Serve the Customer Frontend UI for other static assets
    location / {
        root /var/www/iconicyatra/frontend/dist;
        
        # 1. Try to serve exact static files (like .js, .css, images)
        # 2. If it's not a static file, proxy to Node.js to inject Dynamic SEO Tags!
        try_files $uri @node_frontend;
    }

    location @node_frontend {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /upload {
        alias /var/www/iconicyatra/backend/upload;
        access_log off;
        expires 30d;
    }
}
