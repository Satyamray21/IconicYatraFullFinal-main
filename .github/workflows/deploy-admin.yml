name: Deploy SaaS Admin Dashboard

on:
  push:
    branches:
      - saas-migration
    paths:
      - "dashboard/**"
      - ".github/workflows/deploy-admin.yml"

jobs:
  deploy-admin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install and Build Dashboard
        run: |
          cd dashboard
          npm install --legacy-peer-deps
          VITE_API_BASE_URL=https://api.globevisitors.com/api/v1 VITE_MAIN_URL=https://www.globevisitors.com npm run build

      - name: Copy compiled files to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "dashboard/dist/*"
          strip_components: 0
          target: "/var/www/admin.globevisitors.com"
