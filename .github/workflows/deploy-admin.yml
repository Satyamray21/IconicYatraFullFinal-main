name: Deploy SaaS Admin Dashboard

on:
  push:
    branches:
      - saas-migration
    paths:
      - 'dashboard/**'
      - '.github/workflows/deploy-admin.yml'

jobs:
  deploy-admin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # It is much faster and safer to build React on GitHub's servers than on the VPS!
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          
      - name: Create env file
        run: |
          cd dashboard
          echo "${{ secrets.DASHBOARD_ENV }}" > .env

      - name: Install and Build Dashboard
        run: |
          cd dashboard
          
          npm install --legacy-peer-deps
          npm run build

      - name: Copy compiled files to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "dashboard/dist/*"
          strip_components: 0
          target: "/var/www/admin.globevisitors.com"
