name: Deploy API Backend

on:
  push:
    branches:
      - saas-migration
    paths:
      - 'backend/**'
      - 'ecosystem.config.js'

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Copy backend files to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "backend/*"
          strip_components: 1
          target: "/var/www/api.globevisitors.com/public_html"

      - name: Install dependencies and restart PM2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/api.globevisitors.com/public_html
            npm install --legacy-peer-deps
            
            pm2 start index.js --name "globe-api" || pm2 restart "globe-api" --update-env
