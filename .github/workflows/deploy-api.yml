name: Deploy API Backend

on:
  push:
    branches:
      - feature/fixed-version
    paths:
      - 'backend/**'
      - 'ecosystem.config.js'

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Copy backend files to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "backend/*,ecosystem.config.js"
          strip_components: 0
          target: "/var/www/iconicyatra"

      - name: Install dependencies and restart PM2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/iconicyatra/backend
            npm install --legacy-peer-deps
            
            # Go back to root to start PM2 so the ecosystem relative paths resolve correctly!
            cd /var/www/iconicyatra
            pm2 startOrReload ecosystem.config.js --env production
