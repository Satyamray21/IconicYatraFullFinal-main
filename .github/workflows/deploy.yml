

name: Deploy Customer Frontend

on:
  workflow_dispatch:
  push:
    branches:
      - saas-migration
    paths:
      - 'IconicYatraUI-main/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          
      - name: Install and Build Frontend
        run: |
          cd IconicYatraUI-main
          npm install --legacy-peer-deps
          VITE_BASE_URL=https://api.globevisitors.com VITE_MAIN_URL=https://www.globevisitors.com VITE_ADMIN_URL=https://admin.globevisitors.com npm run build

      - name: Move build output to repo root
        run: |
          rm -rf dist
          cp -r IconicYatraUI-main/dist ./dist

      - name: Copy compiled files to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "dist/*"
          strip_components: 0
          target: "/var/www/globevisitors.com"
