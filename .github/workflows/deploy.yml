name: Deploy Customer Frontend

on:
  push:
    branches:
      - saas-migration
    paths:
      - 'IconicYatraUI-main/**'

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          
      - name: Install and Build Frontend
        run: |
          cd IconicYatraUI-main
          
          # Point to the dedicated API subdomain for globevisitors
          echo "VITE_API_BASE_URL=https://api.globevisitors.com/api/v1" > .env
          echo "VITE_BASE_URL=https://api.globevisitors.com" >> .env
          echo "VITE_MAIN_URL=https://www.globevisitors.com" >> .env
          
          npm install --legacy-peer-deps
          npm run build

      - name: Copy compiled files to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "IconicYatraUI-main/dist/*"
          strip_components: 2
          target: "/var/www/globevisitors.com/public_html"
